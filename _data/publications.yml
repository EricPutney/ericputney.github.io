- title: "ClearPotential: Revealing Local Dark Matter in Three Dimensions"
  authors: [Eric Putney, David Shih, Sung Hak Lim, Matthew R. Buckley]
  year: 2025
  arxiv: "2512.09989"
  # Your summary from the June 2026 site.
  summary: >-
    Using our dust-correction technique from arXiv:2412.14236, ClearPotential upgrades the
    measurement of the local potential in arXiv:2305.13358 to measure the unbiased
    three-dimensional potential and mass density of the local Milky Way. This is a
    first-of-its-kind 3D map of dark matter. We measure the local density of dark matter to be
    about 1/3 of a proton per cubic centimeter (that's the amount of dark matter passing through
    you right now!), place constraints on additional components of dark structure like a dark
    disk, and try to constrain the global structure of the Milky Way's dark matter halo. With
    Gaia DR4 we'll be able to expand this map across much more of our Galaxy.
  figure: /images/papers/clearpotential-density-rz.webp
  figure_alt: "Azimuthally averaged total mass density of the Milky Way in the R-z plane from ClearPotential"
