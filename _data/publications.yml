- title: "Sweeping the Dust Away: Correcting the Phase Space Density of the Milky Way with Unsupervised Machine Learning"
  authors: [Eric Putney, David Shih, Sung Hak Lim, Matthew R. Buckley]
  year: 2024
  arxiv: "2412.14236"
  # Your summary from the June 2026 site.
  summary: >-
    Companion to ClearPotential. Optical surveys like Gaia are blocked by dust in the midplane of
    the Milky Way, so dust extinction biases the measured phase space of nearby stars and gives
    incorrect solutions to the Boltzmann equation. But the Boltzmann equation is just a continuity
    equation for phase space: what if you float the missing fraction of stars as a learnable field
    and find the solution that best obeys this equilibrium equation? Applied to Gaia DR3, we can
    "sweep" the dust out of the way and estimate the unbiased phase space density and local
    potential of the Milky Way.
  figure: /images/papers/sweeping-dust-epsilon.webp
  figure_alt: "Dust efficiency map in the Galactic midplane estimated from the Boltzmann equation"
- title: "Mapping Dark Matter in the Milky Way using Normalizing Flows and Gaia DR3"
  authors: [Sung Hak Lim, Eric Putney, Matthew R. Buckley, David Shih]
  year: 2023
  venue: "JCAP 01 (2025) 021"
  arxiv: "2305.13358"
  doi: 10.1088/1475-7516/2025/01/021
  # Your original summary from the 2023 site, lightly trimmed.
  summary: >-
    We applied our normalizing-flow method to Gaia Data Release 3, the most complete
    survey of stars in our galactic neighborhood, and measured a local dark matter
    density of about 0.47 GeV/cm³, roughly half a proton of dark matter per cubic centimeter.
  figure: /images/papers/mapping-dm-radial-profile.webp
  figure_alt: "Dark matter density measured at twelve points versus Galactic radius, with a generalized NFW fit"
- title: "Measuring Galactic Dark Matter through Unsupervised Machine Learning"
  authors: [Matthew R. Buckley, Sung Hak Lim, Eric Putney, David Shih]
  year: 2022
  venue: "MNRAS 521 (2023) 5100"
  arxiv: "2205.01129"
  doi: 10.1093/mnras/stad843
  # Your original summary from the 2023 site, lightly trimmed.
  summary: >-
    We show that normalizing flows can model the six-dimensional phase space of a
    simulated Milky Way-like galaxy (h277) and accurately recover its acceleration
    and mass density fields.
  figure: /images/papers/measuring-dm-rho-z.webp
  figure_alt: "Mass density recovered from normalizing flows along the vertical axis of the simulated galaxy h277, compared to the simulation truth"
