{%- comment -%}Interactive figure "darkqcd": shared by demos.html and the homepage publication list (include with n="…" to number it). All copy is DRAFT.{%- endcomment -%}
<figure class="demo" id="demo-darkqcd">
    <div class="demo__head">{% if include.n %}<span class="mono">Fig. {{ include.n }}</span>{% endif %}<h3>Cooling the dark sector through confinement</h3></div>
    {% comment %}DRAFT hook line and caption{% endcomment %}
    <p class="demo__headline">Invisible particles clump together as they cool.</p>
    <div class="demo__stage demo__stage--wide">
      <canvas aria-label="A box of invisible dark-sector particles that clump into dark pions and heavy mesons as the temperature drops, beside bars of the extra radiation before and after cooling; Details adds the count of particle kinds against temperature and the time when the first nuclei form"></canvas>
    </div>
    <div class="demo__controls">
      <label class="demo__range dq-range"><span>Dark temperature</span><input type="range" min="0" max="1" step="0.005" value="1" data-ctl="temp"><output class="mono" data-out="temp">10 MeV</output><span class="dq-scale" aria-hidden="true"><span>← cooler</span><span data-out="deg">≈ 120 billion degrees</span><span>hotter →</span></span></label>
      <span class="demo__spacer"></span>
      <button type="button" class="button button--small" data-ctl="cool">Cool</button>
      <button type="button" class="button button--small" data-ctl="more" aria-expanded="false">Details</button>
    </div>
    <div class="demo__controls demo__adv dq-adv">
      <label class="demo__range dq-range"><span>Confinement scale Λ<sub>d</sub></span><input type="range" min="4.5" max="6.5" step="0.01" value="6" data-ctl="tc"><output class="mono" data-out="tc">1.0 MeV</output></label>
    </div>
    <p class="dq-bbn demo__adv" data-out="bbn"></p>
    <figcaption>Clumping reheats the radiation: 37 kinds of particle become 3, so the same heat is shared among fewer kinds. Extra radiation jumps from 0.23 to 0.54. Slide the temperature.
      <span class="mono">Numbers from the paper's fit; particles illustrative<span class="demo__adv">; dark SU(3), g(T) in the lattice (Borsanyi) form</span>.</span></figcaption>
  </figure>
