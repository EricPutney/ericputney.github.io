---
layout: default
---
<article class="post container">
  <header class="post__header">
    <p class="post__meta"><a href="{{ '/writing/' | relative_url }}">Writing</a> <span aria-hidden="true">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1 class="post__title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="post__lede">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post__footer">
    <p>Questions or corrections? <a href="mailto:{{ site.author.email }}?subject={{ page.title | url_encode }}">Email me</a>.</p>
  </footer>
</article>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 300 | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "url": "{{ page.url | absolute_url }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": { "@type": "Person", "@id": "{{ site.url }}/#person", "name": "{{ site.author.name }}", "url": "{{ site.url }}/" },
  "publisher": { "@type": "Person", "name": "{{ site.author.name }}" }
}
</script>
